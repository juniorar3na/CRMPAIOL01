version: '3.8'

services:
  frontend:
    image: ghcr.io/juniorar3na/crmpaiol_frontend:latest
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
      - VITE_AI_BACKEND_URL=${VITE_AI_BACKEND_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - wdraper
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.crm_frontend.rule=Host(`crm.wdraper.com.br`)
        - traefik.http.routers.crm_frontend.entrypoints=websecure
        - traefik.http.routers.crm_frontend.priority=10
        - traefik.http.routers.crm_frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crm_frontend.service=crm_frontend
        - traefik.http.services.crm_frontend.loadbalancer.server.port=8080
        - traefik.http.services.crm_frontend.loadbalancer.passHostHeader=1

  backend:
    image: ghcr.io/juniorar3na/crmpaiol_backend:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WUZAPI_URL=${WUZAPI_URL}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
      # Supabase e chaves devem ser injetadas no Portainer
    networks:
      - wdraper
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.crm_backend.rule=Host(`api-crm.wdraper.com.br`)
        - traefik.http.routers.crm_backend.entrypoints=websecure
        - traefik.http.routers.crm_backend.priority=10
        - traefik.http.routers.crm_backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crm_backend.service=crm_backend
        - traefik.http.services.crm_backend.loadbalancer.server.port=3001
        - traefik.http.services.crm_backend.loadbalancer.passHostHeader=1

networks:
  wdraper:
    external: true
    name: wdraper
